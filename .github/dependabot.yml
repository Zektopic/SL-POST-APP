version: 2
updates:
  # Keeps the SHA-pinned actions in build-apk.yml moving; without this,
  # pinning would freeze CI on whatever was current at pinning time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
